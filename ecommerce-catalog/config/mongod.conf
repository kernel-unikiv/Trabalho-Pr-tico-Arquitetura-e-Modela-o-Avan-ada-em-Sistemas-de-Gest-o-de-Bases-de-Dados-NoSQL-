# =============================================================================
# mongod.conf — Configuração do Daemon MongoDB
# Partilhado entre todos os nós do Replica Set via volume bind mount.
# =============================================================================

storage:
  # WiredTiger é o motor de armazenamento padrão desde MongoDB 3.2.
  # Oferece compressão nativa (snappy por padrão), checkpoints automáticos
  # e journaling — essencial para durabilidade (D de ACID).
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      # Cache de 512MB por nó — ajustar conforme RAM disponível.
      # Regra prática: 50% da RAM disponível menos 1GB.
      cacheSizeGB: 0.5
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  verbosity: 0

net:
  port: 27017
  # bindIpAll: true é equivalente a bindIp: 0.0.0.0 — necessário para que
  # os nós comuniquem entre si via hostname dentro da rede Docker.
  bindIp: 0.0.0.0

# Configuração de segurança: autenticação habilitada.
# O keyFile partilhado garante autenticação intra-cluster.
security:
  authorization: enabled

operationProfiling:
  # Regista queries com tempo de execução superior a 100ms.
  # Essencial para a análise de desempenho no relatório técnico.
  mode: slowOp
  slowOpThresholdMs: 100

replication:
  # Nome do Replica Set — deve ser idêntico ao passado via --replSet.
  replSetName: "rs0"
  # oplogSizeMB: Tamanho do Operation Log. Num ambiente de desenvolvimento
  # com 3 nós, 512MB é suficiente. Em produção, calcular com base no
  # volume de escritas/hora × janela de recuperação desejada.
  oplogSizeMB: 512
